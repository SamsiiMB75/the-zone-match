<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Stamina | THE ZONE MATCH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,700;0,900;1,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="zone-header">
    <div class="header-halftone"></div>
    <div class="header-container">
      <a href="index.html" class="brand-box" style="text-decoration:none; color:inherit;">
        <div class="brand-art-frame">
          <img src="assets/umas.jpg" alt="Win Variation" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
          <div class="art-fallback">V <span>×</span> W</div>
        </div>
        <div class="brand-titles">
          <div class="club-tag">LA ZONA</div>
          <h1>Uma Musume <span>Pretty Derby</span></h1>
          <p>Calculadora de Estadisticas</p>
        </div>
      </a>

      <nav class="zone-nav">
        <a href="index.html" class="nav-tab">Inicio</a>
        <a href="simulador.html" class="nav-tab">Simulador</a>
        <a href="stamina.html" class="nav-tab active">⚡ Calculadora</a>
        <a href="meta.html" class="nav-tab">Meta &amp; CM</a>
      </nav>
    </div>
  </header>

  <main class="zone-main">
    <div class="panel stamina-calc-panel">
      <h2>Calculadora de Stamina &amp; Supervivencia</h2>
      <p class="sub-text">Calcula la Stamina exacta necesaria para hacer un <strong>Full Last Spurt</strong> desde el inicio del último tercio sin quedarte sin energía antes de la meta.</p>

      <div class="stamina-grid">
        <div class="stamina-inputs">
          <div class="field-group">
            <label>Distancia de la Carrera (metros)</label>
            <input type="number" id="sc-distance" value="2400" step="100" min="1000" max="3600" />
          </div>
          <div class="field-group">
            <label>Estrategia / Estilo</label>
            <select id="sc-style">
              <option value="0.95">Líder / Nige (Front Runner)</option>
              <option value="0.89" selected>Delantera / Senkou (Pace Chaser)</option>
              <option value="1.0">Medio / Sashi (Late Surger)</option>
              <option value="0.995">Remate / Oikomi (End Closer)</option>
            </select>
          </div>
          <div class="field-group">
            <label>Velocidad (Speed) Objetivo</label>
            <input type="number" id="sc-speed" value="1200" min="400" max="2000" />
          </div>
          <div class="field-group">
            <label>Agallas (Guts)</label>
            <input type="number" id="sc-guts" value="450" min="200" max="1500" />
          </div>
          <div class="field-group">
            <label>Hab. de Recuperación Doradas (5.5% HP c/u)</label>
            <input type="number" id="sc-gold-heals" value="1" min="0" max="4" />
          </div>
          <div class="field-group">
            <label>Debuffs Enemigos recibidos (Murmur / Nice Nature)</label>
            <select id="sc-debuffs">
              <option value="0">Lobby Limpio (0% daño)</option>
              <option value="0.03">1 Debuffer moderado (-3% HP)</option>
              <option value="0.06">Lobby Competitivo La Zona (-6% HP)</option>
              <option value="0.09">Doble Nice Nature Infierno (-9% HP)</option>
            </select>
          </div>
        </div>

        <div class="stamina-output-box" id="stamina-result-box"></div>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
